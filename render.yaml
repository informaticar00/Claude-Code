# Render blueprint za Telegram Jarvisa.
# Na render.com: New → Blueprint → poveži ovaj repozitorij. Render pročita ovu datoteku.
# Vrijednosti (ključeve i tokene) upisuješ u Render dashboardu; ovdje se ne spremaju.
services:
  - type: web
    name: whatsapp-jarvis
    runtime: node
    plan: free
    rootDir: whatsapp-jarvis
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: ASSISTANT_NAME
        value: Jarvis
      - key: TZ
        value: Europe/Sarajevo
